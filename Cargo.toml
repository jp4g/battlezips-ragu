[workspace]
members = ["crates/battlezips", "crates/wasm-bench"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Tracking ragu `main`; Cargo.lock pins the exact commit.
ragu_pcd = { git = "https://github.com/tachyon-zcash/ragu", branch = "main", default-features = false, features = ["alloc", "baked"] }
ragu_core = { git = "https://github.com/tachyon-zcash/ragu", branch = "main", default-features = false, features = ["alloc"] }
ragu_circuits = { git = "https://github.com/tachyon-zcash/ragu", branch = "main", default-features = false, features = ["alloc", "insecure-test-registry-tag"] }
ragu_primitives = { git = "https://github.com/tachyon-zcash/ragu", branch = "main", default-features = false, features = ["alloc"] }
udon = { package = "zakura-udon", version = "0.1.0", default-features = false, features = ["traits"] }
rand = { version = "0.10", default-features = false, features = ["std_rng"] }

[profile.release]
debug = false
